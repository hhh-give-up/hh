<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思想之旅 · 哲学诘问</title>
  <style>
    /* ===== 像素风蓝白配色 ===== */
    :root {
      --blue-dark: #1a3a6b;
      --blue-mid: #2c5fa8;
      --blue-light: #a8c8f0;
      --blue-pale: #e8f0fc;
      --white: #ffffff;
    }
    * { box-sizing: border-box; image-rendering: pixelated; }
    body {
      margin: 0;
      font-family: "Courier New", monospace;
      background: var(--white);
      color: var(--blue-dark);
      min-height: 100vh;
    }
    /* 像素边框通用样式 */
    .pixel-box {
      border: 4px solid var(--blue-mid);
      box-shadow: 4px 4px 0 var(--blue-light);
      background: var(--white);
      padding: 16px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: 3px solid var(--blue-mid);
      background: var(--blue-pale);
      color: var(--blue-dark);
      padding: 10px 16px;
      box-shadow: 3px 3px 0 var(--blue-light);
      transition: none;
    }
    button:hover { background: var(--blue-light); }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--blue-light); }

    /* ===== 开局页 ===== */
    #startScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 28px;
    }
    #startCircle {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: var(--blue-mid);
      border: 6px solid var(--blue-dark);
      box-shadow: 6px 6px 0 var(--blue-light);
      cursor: pointer;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    #startScreen p {
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--blue-dark);
    }

    /* ===== 游戏主界面 ===== */
    #gameScreen { display: none; max-width: 860px; margin: 0 auto; padding: 20px; }
    .top-title {
      text-align: center;
      font-size: 22px;
      letter-spacing: 3px;
      padding: 10px;
      border-bottom: 4px solid var(--blue-mid);
      margin-bottom: 18px;
    }
    .stage-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }
    .avatar-box { text-align: center; flex: 0 0 130px; }
    .avatar-box img {
      width: 110px; height: 110px;
      border: 4px solid var(--blue-mid);
      background: var(--blue-pale);
      object-fit: contain;
    }
    .avatar-box .name { font-size: 13px; margin-top: 6px; }
    .phil-info { flex: 1; text-align: center; }
    .phil-info h2 { margin: 6px 0; font-size: 20px; }
    .phil-info .school { font-size: 13px; color: var(--blue-mid); }
    .phil-info .round { font-size: 13px; margin-top: 8px; }

    #dialogBox {
      min-height: 80px;
      margin-bottom: 16px;
      font-size: 16px;
      line-height: 1.6;
    }
    #optionsBox { display: flex; flex-direction: column; gap: 10px; }
    #optionsBox button { text-align: left; }

    #freeAskBox { display: none; margin-top: 12px; }
    #freeAskBox textarea {
      width: 100%; min-height: 70px;
      font-family: inherit; font-size: 14px;
      border: 3px solid var(--blue-mid);
      padding: 8px; resize: vertical;
      color: var(--blue-dark);
    }
    #freeAskBox .row { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
    #aiReply {
      margin-top: 12px;
      padding: 12px;
      background: var(--blue-pale);
      border-left: 5px solid var(--blue-mid);
      display: none;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* 全局交互圆 */
    #globalCircle {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--blue-mid);
      border: 4px solid var(--blue-dark);
      box-shadow: 3px 3px 0 var(--blue-light);
      cursor: pointer;
      margin: 18px auto 0;
      display: none;
    }
    #globalCircle:hover { background: var(--blue-light); }

    /* 侧栏：笔记 + 名单 */
    .side-panel {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .side-panel h3 { margin: 0 0 8px; font-size: 14px; }
    #notes {
      width: 100%; min-height: 90px;
      font-family: inherit; font-size: 13px;
      border: 3px solid var(--blue-mid);
      padding: 8px; color: var(--blue-dark);
    }
    #metList { font-size: 13px; line-height: 1.8; }
    #metList span { display: inline-block; margin-right: 8px; }
    #metList .done { color: var(--blue-mid); font-weight: bold; }
    #metList .undone { color: var(--blue-light); }

    #resetBtn { margin-top: 16px; width: 100%; }
  </style>
</head>
<body>

  <!-- ===== 开局页 ===== -->
  <div id="startScreen">
    <div id="startCircle" title="点击开始"></div>
    <p>请开始你的思想之旅</p>
  </div>

  <!-- ===== 游戏主界面 ===== -->
  <div id="gameScreen">
    <div class="top-title">思 想 之 旅</div>

    <div class="stage-row">
      <div class="avatar-box">
        <img id="playerImg" src="images/player.png" alt="player" />
        <div class="name">你</div>
      </div>

      <div class="phil-info pixel-box">
        <h2 id="philName">—</h2>
        <div class="school" id="philSchool">—</div>
        <div class="round" id="roundInfo">—</div>
      </div>

      <div class="avatar-box">
        <img id="philImg" src="" alt="philosopher" />
        <div class="name" id="philImgName">—</div>
      </div>
    </div>

    <div id="dialogBox" class="pixel-box">—</div>
    <div id="optionsBox"></div>

    <div id="freeAskBox">
      <textarea id="questionInput" placeholder="输入你想向这位哲学家提出的问题……"></textarea>
      <div class="row">
        <button id="askBtn">向哲学家提问</button>
        <button id="skipBtn">跳过，前往下一位</button>
      </div>
      <div id="aiReply"></div>
    </div>

    <div id="globalCircle" title="继续"></div>

    <div class="side-panel">
      <div class="pixel-box">
        <h3>思考笔记</h3>
        <textarea id="notes" placeholder="随手记下你的思考……"></textarea>
      </div>
      <div class="pixel-box">
        <h3>遇见哲学家</h3>
        <div id="metList"></div>
        <button id="resetBtn">重置遇见记录</button>
      </div>
    </div>
  </div>

  <!-- 先加载题库，再加载主逻辑 -->
  <script src="philosophers.js"></script>
  <script src="script.js"></script>
</body>
</html>
